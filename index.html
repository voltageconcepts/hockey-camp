<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hockey Camp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Elias's Hockey Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful coach for a 5-year-old, big and simple; a calm Coach Corner for the parent
   IDEA: a rink board and team locker room — drill cards like hockey cards
   PICTURE: an animated little player in a helmet acting out every drill, beside a giant timer
   COLOUR and TYPE: ice white, rink blue, goal-line red, gold stars; Lilita One + Nunito
   LAYOUT: one column on narrow, two on iPad; 64px+ touch targets for small hands */
:root{color-scheme:light dark;--bg:light-dark(#f2f7fc,#0b1726);--card:light-dark(#fff,#13243a);--ink:light-dark(#10223a,#eaf2fb);--mute:light-dark(#4e6580,#9db3cc);--blue:light-dark(#1565c0,#4fa3ff);--red:#e3342f;--gold:#ffb703;--line:light-dark(#d6e3f0,#24405f);--field:light-dark(#f6f9fc,#0f1e31)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px);background:var(--blue);color:#fff;position:sticky;top:0;z-index:5;border-bottom:6px solid var(--red)}
.top h1{font-size:clamp(22px,4vw,34px);flex:1}
.stars{color:#fff;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:99px;font-weight:800;font-size:22px;white-space:nowrap}
.coachbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:15px;min-height:44px;white-space:nowrap}
.coachbtn.hold{background:var(--gold);color:#10223a}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,16px) 60px}
.hero{background:var(--card);border-radius:28px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;box-shadow:0 6px 0 var(--line)}
.hero h2{font-size:clamp(32px,5vw,50px)}
.hero p{color:var(--mute);margin:8px 0 18px}
.go{background:var(--red);color:#fff;font-family:"Lilita One";font-size:clamp(24px,3.4vw,32px);padding:20px 30px;border-radius:22px;box-shadow:0 6px 0 #a21e1a;width:100%;min-height:84px}
.go:active,.tile:active,.btn:active{transform:translateY(4px);box-shadow:none}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
h3.sec{font-size:28px;margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{background:var(--c);color:#fff;border-radius:24px;padding:16px 18px;text-align:left;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 0 rgba(0,0,0,.25);overflow:hidden}
.tile svg{width:96px;height:77px;color:#fff;margin:-6px 0 0 -10px}
.tile b{font-family:"Lilita One";font-weight:400;font-size:28px;line-height:1}
.tile small{font-weight:700;opacity:.92;font-size:15px}
.week{display:flex;gap:10px;flex-wrap:wrap}
.day{background:var(--card);border-radius:18px;padding:10px 6px;width:72px;text-align:center;font-weight:800;font-size:14px;color:var(--mute);box-shadow:0 4px 0 var(--line)}
.day .s{font-size:30px;line-height:1.2;color:var(--line)}.day.on .s{color:var(--gold)}.day.today{outline:3px solid var(--blue)}
.back{background:var(--card);border-radius:16px;padding:12px 20px;font-weight:800;min-height:56px;box-shadow:0 4px 0 var(--line)}
.list{display:grid;gap:14px;margin-top:18px}
.drill{background:var(--card);border-radius:22px;padding:10px 20px 10px 10px;display:flex;align-items:center;gap:14px;text-align:left;min-height:96px;box-shadow:0 5px 0 var(--line);border-left:12px solid var(--c);width:100%}
.drill svg{width:100px;height:80px;flex:none;color:var(--ink)}
.drill b{font-family:"Lilita One";font-weight:400;font-size:25px;display:block;line-height:1.1}
.drill span{color:var(--mute);font-weight:700;font-size:15px}
.drill .g{margin-left:auto;font-size:28px;color:var(--gold);flex:none}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:16px;align-items:start}
.pname{font-size:clamp(34px,6vw,56px);color:var(--c)}
.figbox{background:var(--card);border-radius:26px;margin:14px 0;box-shadow:0 6px 0 var(--line);border:4px solid var(--c);overflow:hidden}
.figbox svg{display:block;width:100%;height:auto;max-height:300px;color:var(--ink)}
.meter{background:var(--card);border-radius:30px;padding:20px;display:grid;justify-items:center;gap:16px;box-shadow:0 6px 0 var(--line)}
.ring{width:min(300px,70vw);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:"Lilita One";font-size:clamp(64px,12vw,100px);line-height:1}
.ring .n small{display:block;font-family:Nunito;font-weight:800;font-size:20px;color:var(--mute)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{flex:1 1 140px;min-height:68px;border-radius:20px;font-family:"Lilita One";font-size:25px;background:var(--blue);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.3);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 16px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}
.btn.done{background:#1f9d55}.btn.yt{background:#cc0000}.btn.vid{background:var(--gold);color:#10223a}
.puck{width:min(270px,64vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3b3f46,#0d0f12 70%);color:#fff;display:grid;place-items:center;font-family:"Lilita One";font-size:clamp(60px,11vw,96px);box-shadow:0 12px 0 #000a,inset 0 -10px 0 #0006}
.puck small{display:block;font-family:Nunito;font-size:20px;font-weight:800;opacity:.75;margin-top:-10px}
.puck:active{transform:scale(.94)}
.steps{margin:6px 0 14px;padding-left:1.3em;font-size:21px;font-weight:700}
.steps li{margin-bottom:8px}
.tip{background:var(--card);border-radius:18px;padding:14px 18px;font-size:16px;color:var(--mute);border:2px dashed var(--line)}
.tip b{color:var(--ink)}
.need{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:4px 14px;font-weight:800;font-size:15px;margin-top:10px}
.pop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,23,38,.6);z-index:20;animation:fade .2s;padding:16px}
.pop>div{background:var(--card);border-radius:32px;padding:28px 36px;text-align:center;box-shadow:0 10px 0 var(--line);max-width:min(900px,96vw);width:auto}
.pop .bigstar{font-size:120px;color:var(--gold);line-height:1;animation:spin .7s}
.pop h2{font-size:40px;margin-top:8px}
.pop video{display:block;width:min(860px,88vw);max-height:66vh;border-radius:18px;background:#000;margin:12px 0}
details{margin-top:34px;background:var(--card);border-radius:20px;padding:16px 20px;font-size:16px;color:var(--mute)}
summary{font-weight:800;color:var(--ink);cursor:pointer;min-height:32px}
details li{margin-bottom:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.vcard{background:var(--card);border-radius:22px;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;transition:transform .2s}
.vcard:active{transform:translateY(4px);box-shadow:none}.vcard.pick{outline:6px solid var(--gold);transform:scale(1.03)}
.th{position:relative;aspect-ratio:16/9;background:#10223a}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .len{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);color:#fff;font-weight:800;font-size:14px;padding:2px 8px;border-radius:6px}
.th .ok{position:absolute;left:8px;top:8px;background:#1f9d55;color:#fff;font-weight:800;font-size:14px;padding:3px 10px;border-radius:99px}
.vcard .tx{padding:12px 16px 16px;display:grid;gap:4px}.vcard b{font-size:18px;line-height:1.25}.vcard small{color:var(--mute);font-weight:700;font-size:14px}
.vstack{display:flex;height:70px;margin-bottom:8px}.vstack img{height:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:3px solid #fff;margin-right:-34px;box-shadow:0 3px 8px #0005}
.rstrip{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border-radius:24px;padding:12px 20px;margin-bottom:18px;box-shadow:0 5px 0 var(--line);text-align:left}
.rstrip b{font-family:"Lilita One";font-weight:400;font-size:26px;line-height:1.05;display:block}.rstrip .bar{margin:6px 0 2px}.rstrip small{color:var(--mute);font-weight:800;font-size:15px}
.rstrip .pill{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.rstrip .pill span{background:var(--field);border-radius:99px;padding:6px 12px;font-weight:800;font-size:17px;white-space:nowrap}
.prize{background:var(--card);border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--line);border-left:12px solid var(--gold)}
.prize b{font-family:"Lilita One";font-weight:400;font-size:24px;display:block;line-height:1.1}.prize span{color:var(--mute);font-weight:800;font-size:15px}
.badge{border-radius:22px;padding:16px;background:var(--card);box-shadow:0 5px 0 var(--line);text-align:center;display:grid;gap:4px;justify-items:center}
.badge .ic{font-size:44px;line-height:1.1}.badge b{font-family:"Lilita One";font-weight:400;font-size:21px}.badge small{color:var(--mute);font-weight:700;font-size:14px}.badge.off{opacity:.5;filter:grayscale(1)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:10px;align-items:end;margin-bottom:6px}.lrow .fld{margin:0}
.yt-frame{position:relative;width:min(860px,calc(96vw - 84px));aspect-ratio:16/9;margin:12px 0;border-radius:16px;overflow:hidden;background:#000}.yt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bignum{width:min(300px,70vw);aspect-ratio:1;border-radius:50%;border:18px solid var(--c);display:grid;place-items:center;text-align:center;font-family:"Lilita One",sans-serif;line-height:.9}.bignum span{font-size:clamp(110px,22vw,170px);color:var(--c)}.bignum small{display:block;font-family:Nunito;font-weight:800;font-size:22px;color:var(--mute);margin-top:-20px}
.link{background:none;color:var(--blue);text-decoration:underline;font-size:16px;font-weight:700;padding:8px 0;min-height:44px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10223a;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:30;font-size:16px;max-width:90vw;text-align:center}
/* coach corner */
.panel{background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:0 5px 0 var(--line);margin-top:16px}
.panel h3{font-size:26px;margin-bottom:6px}
.note{color:var(--mute);font-size:15px;margin:0 0 10px}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mixrow{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:14px;padding:8px 10px;font-weight:800;font-size:16px}
.mixrow .nm{flex:1}
.step{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-size:24px;font-weight:800;line-height:1}
.mixrow output{width:26px;text-align:center;font-size:20px}
.crow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.crow svg{width:76px;height:61px;flex:none;color:var(--ink)}
.crow .nm{flex:1;font-weight:800;font-size:17px;line-height:1.25}
.crow.off{opacity:.45}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--field);color:var(--mute);margin:2px 4px 0 0;border:1px solid var(--line)}
.sbtn{background:var(--blue);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px;font-size:16px;white-space:nowrap}
.sbtn.alt{background:var(--field);color:var(--ink);border:2px solid var(--line)}.sbtn.red{background:var(--red)}
.form{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
.fld{display:grid;gap:4px;margin-bottom:14px;font-weight:800;font-size:15px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{font-size:17px;font-weight:600;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--field);width:100%;min-height:48px}
.fld textarea{min-height:120px;resize:vertical;font-family:Nunito}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chk{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-height:44px}
.chk input{width:26px;height:26px;accent-color:var(--blue)}
.vstat{font-size:15px;color:var(--mute);font-weight:700}
@keyframes spin{from{transform:scale(.2) rotate(-180deg)}to{transform:none}}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.pop,.pop .bigstar{animation:none}.bar i{transition:none}}
@media(max-width:760px){.hero,.play,.form{grid-template-columns:minmax(0,1fr)}.day{width:calc((100% - 60px)/7);padding:8px 2px}.top h1{font-size:20px}}
</style>
</head>
<body>
<header class="top"><h1>Elias's Hockey Camp</h1><button class="stars" id="starbtn" aria-label="My rewards"><span style="color:var(--gold)">★</span><span id="sc">0</span></button><button class="coachbtn" id="coach" aria-label="Coach corner, press and hold">Coach</button></header>
<main class="wrap" id="app"></main>
<script>
{
/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ytOk=u=>/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\/\S+$/i.test(String(u||''));
const dstr=d=>d.toLocaleDateString('en-CA');const today=()=>dstr(new Date());
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

/* ---------- animation engine: a little player acting out each drill ---------- */
const po=(b,o)=>Object.assign({},b,o);
const BASE={H:[100,32],N:[100,48],P:[100,92],Le:[86,68],Lh:[82,90],Re:[114,68],Rh:[118,90],Lk:[94,120],Lf:[92,148],Rk:[106,120],Rf:[108,148]};
const ST={H:[100,42],N:[100,58],P:[100,98],Le:[90,76],Lh:[94,96],Re:[114,74],Rh:[108,80],Lk:[86,122],Lf:[82,148],Rk:[114,122],Rf:[118,148]};
const SD={H:[92,40],N:[96,56],P:[100,96],Le:[106,72],Lh:[116,96],Re:[100,74],Rh:[104,78],Lk:[92,122],Lf:[84,148],Rk:[112,122],Rf:[118,148]};
const SQ=po(BASE,{H:[100,50],N:[100,64],P:[100,104],Le:[86,84],Lh:[90,112],Re:[114,84],Rh:[110,112],Lk:[86,124],Lf:[88,148],Rk:[114,124],Rf:[112,148]});
const DK=po(BASE,{H:[100,72],N:[100,86],P:[100,122],Le:[86,100],Lh:[80,116],Re:[114,100],Rh:[120,116],Lk:[80,128],Lf:[86,148],Rk:[120,128],Rf:[114,148]});
const AIR=po(BASE,{Lk:[92,114],Rk:[108,114],Lf:[90,138],Rf:[110,138],Le:[80,60],Lh:[72,46],Re:[120,60],Rh:[128,46]});
const HK1=po(BASE,{Lk:[88,100],Lf:[94,124],Lh:[96,62],Le:[84,72],Rh:[120,94]}),HK2=po(BASE,{Rk:[112,100],Rf:[106,124],Rh:[104,62],Re:[116,72],Lh:[80,94]});
const WIND=po(SD,{P:[94,98],H:[86,42],N:[90,58],Rh:[96,76]}),REL=po(SD,{P:[108,96],H:[110,40],N:[108,56],Rh:[112,70],Lk:[100,122],Rk:[120,120]});
const BR={H:[152,104],N:[140,108],P:[88,98],Le:[146,128],Lh:[150,148],Re:[138,128],Rh:[140,148],Lk:[82,124],Lf:[76,148],Rk:[94,124],Rf:[88,148]};
const CR={H:[150,98],N:[138,108],P:[90,112],Le:[136,128],Lh:[130,148],Re:[142,128],Rh:[138,148],Lk:[72,96],Lf:[64,148],Rk:[80,96],Rf:[74,148]};
const PL={H:[160,114],N:[148,118],P:[100,126],Le:[146,148],Lh:[162,148],Re:[144,148],Rh:[158,148],Lk:[76,136],Lf:[50,146],Rk:[78,137],Rf:[52,147]};
const WS={H:[66,62],N:[66,78],P:[68,116],Le:[78,96],Lh:[96,110],Re:[76,98],Rh:[94,112],Lk:[104,116],Lf:[104,148],Rk:[106,118],Rf:[106,148]};
const SM={H:[158,136],N:[146,140],P:[100,142],Le:[164,140],Lh:[182,140],Re:[162,141],Rh:[180,141],Lk:[76,142],Lf:[52,142],Rk:[76,143],Rf:[52,143]};
const FL=po(BASE,{Rk:[118,110],Rf:[100,120],Le:[74,62],Lh:[58,66],Re:[126,62],Rh:[142,66]});
const BF={H:[100,74],N:[100,90],P:[100,132],Le:[86,112],Lh:[96,138],Re:[114,112],Rh:[104,138],Lk:[66,130],Lf:[96,144],Rk:[134,130],Rf:[104,144]};
const k=(p,t,x)=>Object.assign({p,t},x||{});
const dribK=(w=1)=>[k(ST,380,{B:[100-22*w,146],o:[100-34*w,144]}),k(po(ST,{Rh:[112,80]}),380,{B:[100+22*w,146],o:[100+34*w,144]})];
const M={
jacks:{n:'Jumping jacks',k:[k(BASE,350),k(po(BASE,{Le:[78,42],Lh:[84,16],Re:[122,42],Rh:[116,16],Lk:[84,120],Lf:[72,148],Rk:[116,120],Rf:[128,148]}),350)]},
knees:{n:'High knees / running',k:[k(HK1,220),k(HK2,220)]},
circles:{n:'Arm circles',k:[0,1,2,3].map(i=>{const a=i*Math.PI/2;return k(po(BASE,{Le:[78,50],Lh:[60+10*Math.cos(a),50+10*Math.sin(a)],Re:[122,50],Rh:[140-10*Math.cos(a),50+10*Math.sin(a)]}),200)})},
kick:{n:'Leg kicks',k:[k(BASE,300),k(po(BASE,{Rk:[116,100],Rf:[128,72],Lh:[124,72],Le:[106,62]}),300),k(BASE,300),k(po(BASE,{Lk:[84,100],Lf:[72,72],Rh:[76,72],Re:[94,62]}),300)]},
dribble:{n:'Dribble side to side',stick:1,k:dribK()},

const isVoice=x=>x.reps&&x.cnt==='voice',isAuto=x=>!x.reps,isFree=x=>x.cat==='warm'||x.cat==='cool';
function openDrill(x){stop();S.d=x;T={left:x.secs,run:false,id:0,reps:0,cnt:0,half:false,ready:0,done:false};S.view='drill';render();
  const go=()=>{if(isVoice(x)){if(S.view==='drill'&&S.d===x)say(`${S.q?'Next up: ':''}${x.name}. Do ${target(x)}!${x.sw?' Switch sides halfway.':''}`)}else autoGo()};
  if(SET.autoVid&&hasVid(x))playVideo(x,go);else go()}
function autoGo(){if(S.view==='drill'&&S.q&&isAuto(S.d)&&!T.run&&!T.ready)getReady()}
function getReady(){const x=S.d;stop();T.ready=10;T.run=true;say(`${S.q?'Next up: ':''}${x.name}. Get ready!`);paint();
  T.id=setInterval(()=>{T.ready--;if(T.ready<=3&&T.ready>0){beep(660);say(String(T.ready))}
    if(T.ready<=0){clearInterval(T.id);T.ready=0;T.run=false;beep(1100,.25);say('Go!');begin()}else paint()},1000)}
function begin(){const x=S.d;T.run=true;if(isVoice(x)){T.id=setInterval(countTick,SET.beat*1000)}else T.id=setInterval(tick,1000);paint()}
function countTick(){const x=S.d,n=target(x);T.cnt++;beep(T.cnt>=n?1320:760,.08);
  if(x.sw&&T.cnt===x.reps&&T.cnt<n){T.half=true;say(T.cnt+'. Switch!')}else say(String(T.cnt));

  else if(t.type==='checkbox')e[f]=t.checked});
app.addEventListener('input',ev=>{const t=ev.target,f=t.dataset.f,e=S.edit;
  if((t.dataset.r==='name'||t.dataset.r==='finish')&&S.redit){S.redit[t.dataset.r]=t.value;return}
  if(!f||!e)return;
  if(f==='name'||f==='need'||f==='tip'||f==='yt')e[f]=t.value;
  else if(f==='steps')e.steps=t.value.split('\n').map(s=>s.trim()).filter(Boolean);
  else if(f==='amt'){const n=Math.max(1,Math.round(+t.value||0));if(e.reps)e.reps=Math.min(99,n);else e.secs=Math.min(600,n)}});
/* Coach button: press and hold so little hands don't wander in */
{const cb=document.getElementById('coach');let h=0;
 const go=()=>{cb.classList.remove('hold');if(['drill','edit','redit','water','finish'].includes(S.view))return;S.view='coach';render()};
 cb.addEventListener('pointerdown',()=>{cb.classList.add('hold');h=setTimeout(()=>{h=0;go()},1200)});
 const cancel=()=>{cb.classList.remove('hold');if(h){clearTimeout(h);h=0;return true}};
 cb.addEventListener('pointerup',()=>{if(cancel())toast('Grown-ups: press and hold Coach')});
 cb.addEventListener('pointerleave',cancel);cb.addEventListener('pointercancel',cancel);
 cb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}
function ytPlay({id,list,name,min,ask=true}){const t0=Date.now(),src=id?`https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0&modestbranding=1&autoplay=1${list?'&list='+list:''}`:`https://www.youtube-nocookie.com/embed/videoseries?list=${list}&playsinline=1&rel=0&modestbranding=1`,ext=id?`https://www.youtube.com/watch?v=${id}${list?'&list='+list:''}`:`https://www.youtube.com/playlist?list=${list}`;
  if(!navigator.onLine)toast('Videos need internet — connect to Wi-Fi.');
  pop(`<h2 style="font-size:28px">${esc(name||'Video')}</h2><div class="yt-frame"><iframe src="${esc(src)}" title="${esc(name||'Video')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="row"><button class="btn done" data-close>Done</button><a class="btn alt" href="${esc(ext)}" target="_blank" rel="noopener" style="flex:0 1 220px;font-size:18px">Won't play? Open YouTube</a></div>`,0,()=>{if(ask&&Date.now()-t0>=60000)askFinished({name,id:id||'',min:min||0})})}
function askFinished(y){const p=pop(`<div class="bigstar">▶</div><h2>Did you finish your video?</h2><p style="font-weight:800;font-size:20px">${esc(y.name||'')}</p><div class="row"><button class="btn done" data-close data-yes="1">Yes! I did it!</button><button class="btn alt" data-close>Not yet</button></div>`,0);
  p.querySelector('[data-yes]').addEventListener('click',()=>{if(y.id)P.vw={...P.vw,[y.id]:1};const r=completeSession(y.min>=20,null);beep(1320,.3);if(S.view==='pl'||S.view==='home')render(true);setTimeout(()=>celebrate('Video complete!',r),50)})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!S.yt)return;const y=S.yt;S.yt=null;if(Date.now()-y.t<60000)return;const v={name:y.name};
  const p=pop(`<div class="bigstar">▶</div><h2>Did you finish your video?</h2><p style="font-weight:800;font-size:20px">${esc(v?v.name:'')}</p><div class="row"><button class="btn done" data-close data-yes="1">Yes! I did it!</button><button class="btn alt" data-close>Not yet</button></div>`,0);
  p.querySelector('[data-yes]').addEventListener('click',()=>{if(y.id)P.vw={...P.vw,[y.id]:1};const r=completeSession(y.min>=20,null);beep(1320,.3);if(S.view==='pl'||S.view==='home')render(true);setTimeout(()=>celebrate('Video complete!',r),50)})});
document.getElementById('starbtn').addEventListener('click',()=>{if(['drill','water','finish','edit','redit'].includes(S.view))return;S.view='rw';render()});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
